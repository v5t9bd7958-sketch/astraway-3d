
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>AstraWay — Walking Preview</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090b10;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #viewer {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #status {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: 8px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 8px;
      color: #d7e1ff;
      font: 12px/1.4 monospace;
      white-space: pre-wrap;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <canvas id="viewer"></canvas>
  <div id="status">AstraWay — загрузка персонажа…</div>

  <script type="module" src="/src/walk-preview.js"></script>
</body>
</html>
