<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>AstraWay Character Lab</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090b10;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #viewer {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #status {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: 8px;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.72);
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.35;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #d7e1ff;
      white-space: pre-wrap;
      word-break: break-word;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="viewer"></canvas>
  <div id="status">AstraWay — загрузка…</div>

  <!-- Eruda: мобильная консоль для iPhone Safari -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    if (window.eruda) {
      window.eruda.init();
    }
  </script>

  <!-- AstraWay main entry -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
