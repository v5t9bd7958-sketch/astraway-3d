<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>AstraWay 3D — Diagnostic Loader</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090b10;
      font-family: monospace;
    }

    #viewer {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    #status {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.72);
      color: #ddd;
      font-size: 13px;
      line-height: 1.35;
      border-radius: 8px;
      white-space: pre-wrap;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>

<body>
  <canvas id="viewer"></canvas>

  <div id="status">Initializing…</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
